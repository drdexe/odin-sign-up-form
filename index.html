<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>
      <img src="images/odin-lined.png" alt="Odin logo" width="15%">
      ODIN
    </h1>
    <footer>Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></footer>
  </header>
  <main>
    <div>
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <span class="italic">now</span> to get started.</p>
      <p>You <span class="italic">know</span> you want to.</p>
    </div>
    <form action="#" method="post">
      <div class="form-container">
        <p>Let's do this!</p>
        <div class="input-container">
          <div>
            <label for="first_name">FIRST NAME</label>
            <input type="text" id="first_name" name="first_name" autocomplete="given-name" required>
          </div>
          <div>
            <label for="first_name">LAST NAME</label>
            <input type="text" id="last_name" name="last_name" autocomplete="family-name" required>
          </div>
          <div>
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" autocomplete="email">
          </div>
          <div>
            <label for="phone_number">PHONE NUMBER</label>
            <input type="tel" id="phone_number" name="phone_number" autocomplete="tel">
          </div>
          <div>
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
          </div>
          <div>
            <label for="confirm_password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
          </div>
        </div>
      </div>
      <button type="submit">Create Account</button>
    </form>
    <div>Already have an account? <a href="#">Log in</a></div>
  </main>
</body>
</html>
